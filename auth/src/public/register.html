    <title>Infinite Domain | Register</title>
</head>
<body>
    <a href="../../../index.html" class="button-class">Back</a>
    <hr>
    <div class="container">
        <div class="form">
            <form class="form-elements">
                <div class="element-container">
                    <label class="form-element_label" for="text">Username</label>
                    <input type="text" class="form-element_input" id="userName" autocomplete="on">

                    <label class="form-element_label" for="email">Email address</label>
                    <input type="text" class="form-element_input" id="userName" autocomplete="on">
                    
                    <p>or</p>
                    <label class="form-element_label" for="phone">Phone number</label>
                    <input type="tel" class="form-element_input" id="userName" autocomplete="on">   

                    <br>
                    <label class='form-element_label' for="password">Password</label>
                    <input class='form-element_input' type="password" id="password" autocomplete='on'>

                    <br>
                    <button id='form-element-submit' type='button'>Continue</button>

                    <p>or Continue with:</p>
                    <button>Email</button>
                    <button>Steam</button>
                </div>
            </form>
        </div>
    </div>
